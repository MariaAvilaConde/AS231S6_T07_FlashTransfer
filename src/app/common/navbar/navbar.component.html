<!-- Desktop Navbar -->
<nav class="navbar">
  <div class="navbar-container">
    <!-- Logo -->
    <div class="navbar-logo" [routerLink]="'/'">
      <span class="logo-icon">⚡</span>
      <span class="logo-text">FlashTransfer</span>
    </div>
    
    <!-- Navigation Menu -->
    <div class="nav-menu">
      <a class="nav-link" routerLink="/dashboard" routerLinkActive="active">
        <span>🏠</span> Dashboard
      </a>
      <a class="nav-link" routerLink="/transaction" routerLinkActive="active">
        <span>💸</span> Transferir
      </a>
      <app-network-switcher></app-network-switcher>
    </div>
    
    <!-- User Menu -->
    <div class="user-menu" *ngIf="address">
      <button class="user-button" (click)="toggleUserMenu()">
        <img [src]="avatarUrl" alt="Avatar" class="user-avatar" *ngIf="avatarUrl">
        <div class="user-address">{{ shortened }}</div>
        <span class="dropdown-icon">▼</span>
      </button>
      
      <div class="dropdown-menu" [class.open]="userMenuOpen">
        <a class="dropdown-item" (click)="copiarUsuario(address)">
          <span class="dropdown-item-icon">📋</span>
          Copiar Dirección
        </a>
        <a class="dropdown-item" routerLink="/dashboard">
          <span class="dropdown-item-icon">📊</span>
          Dashboard
        </a>
        <a class="dropdown-item" routerLink="/transaction">
          <span class="dropdown-item-icon">💸</span>
          Transferir
        </a>
        <a class="dropdown-item" (click)="logout()">
          <span class="dropdown-item-icon">🚪</span>
          Desconectar
        </a>
      </div>
    </div>
    
    <!-- Mobile Menu Button -->
    <button class="mobile-menu-button" (click)="toggleMenuAbierto()">
      <span>☰</span>
    </button>
  </div>
</nav>

<!-- Mobile Menu -->
<div class="mobile-menu" [class.open]="menuAbierto">
  <div class="mobile-menu-header">
    <div class="navbar-logo" (click)="toggleMenuAbierto()" [routerLink]="'/'">
      <span class="logo-icon">⚡</span>
      <span class="logo-text">FlashTransfer</span>
    </div>
    <button class="mobile-close-button" (click)="toggleMenuAbierto()">
      <span>×</span>
    </button>
  </div>
  
  <div class="mobile-nav-links">
    <a class="mobile-nav-link" routerLink="/dashboard" routerLinkActive="active" (click)="toggleMenuAbierto()">
      <span>🏠</span> Dashboard
    </a>
    <a class="mobile-nav-link" routerLink="/transaction" routerLinkActive="active" (click)="toggleMenuAbierto()">
      <span>💸</span> Transferir
    </a>
  </div>
  
  <div class="mobile-user-menu" *ngIf="address">
    <div class="user-info">
      <img [src]="avatarUrl" alt="Avatar" class="user-avatar" *ngIf="avatarUrl">
      <div class="user-address">{{ shortened }}</div>
    </div>
    <div class="mobile-actions">
      <button class="btn btn-secondary" (click)="copiarUsuario(address)">
        <span>📋</span> Copiar Dirección
      </button>
      <button class="btn btn-danger" (click)="logout()">
        <span>🚪</span> Desconectar
      </button>
    </div>
  </div>
</div>
