<!-- Navbar principal -->
<div class="flex h-screen bg-slate-100">

  <!-- Sidebar vertical -->
  <aside
    [class.w-64]="menuAbierto"
    [class.w-20]="!menuAbierto"
    class="bg-gradient-to-br from-teal-700 to-teal-500 text-white transition-all duration-300 flex flex-col">

    <!-- Logo y toggle -->
    <div class="flex items-center justify-between p-4">
      <button (click)="toggleMenuAbierto()" class="p-2 hover:bg-teal-600 rounded-lg">
        <svg class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
    </div>

    <!-- Opciones del menú -->
    <nav class="flex-1">
      <ul class="mt-4 space-y-2">

        <li>
          <a routerLink="/dashboard" routerLinkActive="bg-teal-600" 
             class="flex items-center gap-3 px-4 py-2 hover:bg-teal-600 rounded-md cursor-pointer">
            <svg class="h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none"
                 viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
            </svg>
            <span *ngIf="menuAbierto">Dashboard</span>
          </a>
        </li>

        <li>
          <a routerLink="/transaction" routerLinkActive="bg-teal-600"
             class="flex items-center gap-3 px-4 py-2 hover:bg-teal-600 rounded-md cursor-pointer">
            <svg class="h-5 w-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span *ngIf="menuAbierto">Transacción</span>
          </a>
        </li>

        <li>
          <a  
            [routerLink]="['/history']"
            routerLinkActive="bg-teal-600"
            [routerLinkActiveOptions]="{ exact: true }"
            class="flex items-center gap-3 px-4 py-2 hover:bg-teal-600 rounded-md cursor-pointer">

            <svg class="h-5 w-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
            </svg>

            <span *ngIf="menuAbierto">Historial</span>
          </a>
        </li>

      </ul>
    </nav>
  </aside>

  <!-- Contenido principal con barra horizontal -->
  <div class="flex-1 flex flex-col">

    <!-- Encabezado horizontal -->
    <header class="h-16 bg-gradient-to-r from-teal-700 to-teal-500 text-white flex items-center justify-between px-6 shadow-md">

      <div class="flex items-center gap-3">
        <img src="https://upload.wikimedia.org/wikipedia/commons/3/36/MetaMask_Fox.svg" alt="Logo" class="w-8">
        <h1 class="text-xl font-bold">FlashTransfer</h1>
        <app-network-switcher></app-network-switcher>
      </div>

      <!-- =========================== -->
      <!-- SI NO HAY WALLET CONECTADA -->
      <!-- =========================== -->
      <button *ngIf="!address"
              (click)="conectarWallet()"
              class="flex items-center gap-2 bg-gradient-to-r from-blue-500 to-purple-600 hover:opacity-90 
                     px-4 py-2 rounded-xl text-white shadow-lg transition">
        <img src="https://upload.wikimedia.org/wikipedia/commons/3/36/MetaMask_Fox.svg" class="w-6" />
        Conectar Wallet
      </button>

      <!-- =========================== -->
      <!-- SI SÍ HAY WALLET CONECTADA -->
      <!-- =========================== -->
      <div *ngIf="address" class="relative">
        <button (click)="toggleUserMenu()"
                class="flex items-center gap-3 rounded-full bg-teal-800 px-4 py-2 hover:bg-teal-700 transition">
          <div class="relative">
            <img class="h-10 w-10 rounded-full border-2 border-gray-500 object-cover" [src]="avatarUrl"
                 alt="User avatar" />
            <div class="absolute bottom-0 right-0 h-3 w-3 rounded-full border-2 border-teal-900 bg-green-500"></div>
          </div>
          <div class="text-left">
            <p class="text-sm font-semibold">{{ shortened }}</p>
            <p class="text-xs text-gray-300">Conectado</p>
          </div>
        </button>

        <!-- Menú desplegable -->
        <div *ngIf="userMenuOpen"
             class="absolute right-0 mt-2 w-64 bg-white text-gray-800 rounded-xl shadow-lg ring-1 ring-gray-300 z-50">

          <div class="p-4 border-b">
            <p class="font-semibold">{{ shortened }}</p>
            <p class="text-sm text-gray-500 truncate max-w-[150px]" title="{{ address }}">
              {{ address }}
            </p>
            <button (click)="copiarUsuario(address)" class="text-gray-500 hover:text-black focus:outline-none">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24"
                   stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M8 16h8M8 12h8m-6 8h6a2 2 0 002-2V8a2 2 0 00-2-2h-6l-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2h2" />
              </svg>
            </button>
          </div>

          <div class="py-2">
            <a class="flex items-center gap-3 px-4 py-2 hover:bg-gray-100">
              <svg class="h-5 w-5 text-gray-800" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
              </svg>
              <span>Mi Perfil</span>
            </a>
          </div>

          <div class="py-2 border-t">
            <a (click)="logout()" class="flex items-center gap-3 px-4 py-2 text-red-600 hover:bg-red-100 cursor-pointer">
              <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1" />
              </svg>
              <span>Cerrar Sesión</span>
            </a>
          </div>

        </div>
      </div>

    </header>

    <main class="p-6 flex-1 overflow-y-auto">
      <router-outlet></router-outlet>
    </main>
  </div>

</div>
